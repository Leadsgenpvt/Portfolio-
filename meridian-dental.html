<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian Dental Co. — Book Your Visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#12201D;
    --pine:#1B4B43;
    --pine-deep:#0F332C;
    --mint:#8FD4C1;
    --mint-pale:#E7F5F0;
    --paper:#F3F7F5;
    --coral:#FF7A59;
    --coral-deep:#E75F3E;
    --line:rgba(18,32,29,0.12);
    --shadow: 0 20px 50px -20px rgba(15,51,44,0.35);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  p{margin:0;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  section{position:relative;}
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 32px;
  }
  ::selection{background:var(--coral);color:#fff;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- reveal on scroll ---------- */
  .reveal{
    opacity:0;
    transform:translateY(28px);
    transition:opacity 0.8s cubic-bezier(.22,1,.36,1), transform 0.8s cubic-bezier(.22,1,.36,1);
  }
  .reveal.in{opacity:1; transform:translateY(0);}
  .reveal-delay-1.in{transition-delay:0.1s;}
  .reveal-delay-2.in{transition-delay:0.2s;}
  .reveal-delay-3.in{transition-delay:0.3s;}

  /* ---------- nav ---------- */
  .nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:100;
    padding:26px 0;
    transition:padding 0.4s cubic-bezier(.22,1,.36,1), background 0.4s ease, box-shadow 0.4s ease, backdrop-filter 0.4s ease;
  }
  .nav.scrolled{
    padding:12px 0;
    background:rgba(243,247,245,0.72);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 8px 30px -18px rgba(15,51,44,0.35);
  }
  .nav-inner{
    max-width:1180px;
    margin:0 auto;
    padding:0 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    color:var(--pine-deep);
  }
  .logo svg{width:26px;height:26px;transition:transform 0.4s ease;}
  .nav.scrolled .logo svg{transform:scale(0.9);}
  .nav-links{
    display:flex;
    gap:34px;
    list-style:none;
    margin:0; padding:0;
    font-size:15px;
    font-weight:600;
  }
  .nav-links a{
    position:relative;
    color:var(--pine-deep);
    padding:4px 0;
  }
  .nav-links a::after{
    content:'';
    position:absolute;
    left:0; bottom:-2px;
    width:0%; height:2px;
    background:var(--coral);
    border-radius:2px;
    transition:width 0.3s cubic-bezier(.22,1,.36,1);
  }
  .nav-links a:hover::after{width:100%;}
  .nav-cta{
    background:var(--pine-deep);
    color:#fff;
    padding:10px 20px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
    box-shadow:0 8px 20px -8px rgba(15,51,44,0.6);
    transition:transform 0.25s ease, background 0.25s ease;
  }
  .nav-cta:hover{background:var(--coral-deep); transform:translateY(-2px);}
  .nav-toggle{display:none;}

  /* ---------- hero ---------- */
  .hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding:150px 0 90px;
    background:
      radial-gradient(circle at 82% 18%, rgba(143,212,193,0.55), transparent 55%),
      radial-gradient(circle at 10% 85%, rgba(255,122,89,0.14), transparent 45%),
      var(--paper);
    position:relative;
    overflow:hidden;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    gap:60px;
    align-items:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--pine);
    background:var(--mint-pale);
    padding:8px 14px;
    border-radius:999px;
    margin-bottom:24px;
  }
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--coral);animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.7);}}

  .hero h1{
    font-size:clamp(40px, 5.4vw, 74px);
    line-height:1.02;
    color:var(--pine-deep);
  }
  .hero h1 em{
    font-style:italic;
    color:var(--coral);
    position:relative;
    white-space:nowrap;
  }
  .hero-sub{
    margin-top:24px;
    font-size:18px;
    line-height:1.6;
    color:rgba(18,32,29,0.72);
    max-width:460px;
  }
  .hero-actions{
    margin-top:38px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    align-items:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 28px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    border:none;
    transition:transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease, background 0.3s ease;
  }
  .btn-primary{
    background:var(--coral);
    color:#fff;
    box-shadow:0 14px 30px -12px rgba(231,95,62,0.65);
    animation:bounceIn 1s cubic-bezier(.34,1.56,.64,1) 0.3s both;
  }
  .btn-primary:hover{
    transform:translateY(-4px) scale(1.03);
    background:var(--coral-deep);
    box-shadow:0 18px 36px -12px rgba(231,95,62,0.75);
  }
  .btn-primary:active{transform:translateY(-1px) scale(0.98);}
  @keyframes bounceIn{
    0%{transform:scale(0.6); opacity:0;}
    60%{transform:scale(1.06); opacity:1;}
    80%{transform:scale(0.96);}
    100%{transform:scale(1);}
  }
  .btn-ghost{
    background:transparent;
    color:var(--pine-deep);
    border:1.5px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--pine-deep); transform:translateY(-2px);}

  .hero-stats{
    margin-top:46px;
    display:flex;
    gap:36px;
  }
  .hero-stats div strong{
    display:block;
    font-family:'Fraunces',serif;
    font-size:28px;
    color:var(--pine-deep);
  }
  .hero-stats div span{
    font-size:13px;
    color:rgba(18,32,29,0.6);
  }

  /* hero visual: smile-arc rings + tooth */
  .hero-visual{
    position:relative;
    height:520px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .orbit-ring{
    position:absolute;
    border-radius:50%;
    border:1.5px dashed rgba(27,75,67,0.22);
  }
  .orbit-ring.r1{width:420px;height:420px;animation:spin 40s linear infinite;}
  .orbit-ring.r2{width:330px;height:330px;animation:spin 30s linear infinite reverse;}
  @keyframes spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}

  .tooth-card{
    position:relative;
    width:280px;
    height:340px;
    background:linear-gradient(155deg,#ffffff, var(--mint-pale));
    border-radius:36px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0px) rotate(-1deg);} 50%{transform:translateY(-16px) rotate(1deg);}}
  .tooth-card svg{width:150px;height:150px;}

  .sparkle{
    position:absolute;
    width:10px;height:10px;
    background:var(--coral);
    border-radius:50%;
    opacity:0.8;
    animation:sparkle 2.4s ease-in-out infinite;
  }
  .sparkle:nth-child(1){top:16%; left:20%; animation-delay:0s;}
  .sparkle:nth-child(2){top:70%; left:14%; animation-delay:0.6s; background:var(--mint);}
  .sparkle:nth-child(3){top:22%; left:80%; animation-delay:1.1s; background:var(--mint);}
  .sparkle:nth-child(4){top:78%; left:76%; animation-delay:1.7s;}
  @keyframes sparkle{
    0%,100%{opacity:0; transform:scale(0.4) translateY(0);}
    50%{opacity:1; transform:scale(1) translateY(-10px);}
  }

  .smile-line{
    position:absolute;
    bottom:-6px; left:50%;
    transform:translateX(-50%);
    width:260px;
  }
  .smile-line path{
    fill:none;
    stroke:var(--coral);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:300;
    stroke-dashoffset:300;
    animation:draw 1.8s cubic-bezier(.22,1,.36,1) 0.6s forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}

  /* ---------- section headers ---------- */
  .section-head{
    max-width:560px;
    margin-bottom:56px;
  }
  .section-head .eyebrow{margin-bottom:18px;}
  .section-head h2{
    font-size:clamp(32px,3.6vw,46px);
    color:var(--pine-deep);
    line-height:1.08;
  }
  .section-head p{
    margin-top:16px;
    font-size:17px;
    color:rgba(18,32,29,0.68);
    line-height:1.6;
  }
  .center{margin-left:auto; margin-right:auto; text-align:center;}

  /* divider: smile-drip */
  .drip-divider{
    display:block;
    width:100%;
    height:46px;
  }
  .drip-divider path{ transition: d 0.3s ease; }

  /* ---------- services ---------- */
  .services{
    padding:120px 0 100px;
    background:var(--paper);
  }
  .service-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:26px;
    perspective:1400px;
  }
  .service-card{
    height:290px;
    background:transparent;
  }
  .flip-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.7s cubic-bezier(.22,1,.36,1);
    transform-style:preserve-3d;
  }
  .service-card:hover .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;
    inset:0;
    border-radius:22px;
    backface-visibility:hidden;
    padding:28px;
    display:flex;
    flex-direction:column;
  }
  .flip-front{
    background:#fff;
    border:1px solid var(--line);
    justify-content:space-between;
    box-shadow:0 18px 40px -28px rgba(15,51,44,0.4);
  }
  .flip-front .icon-wrap{
    width:56px;height:56px;
    border-radius:16px;
    background:var(--mint-pale);
    display:flex; align-items:center; justify-content:center;
    color:var(--pine);
    transition:transform 0.4s ease, background 0.4s ease;
  }
  .service-card:hover .flip-front .icon-wrap{transform:rotate(-8deg) scale(1.08); background:var(--mint);}
  .flip-front h3{font-size:22px; color:var(--pine-deep); margin-top:20px;}
  .flip-front .tag{
    font-size:13px; font-weight:700; color:var(--coral);
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .flip-back{
    background:linear-gradient(155deg, var(--pine-deep), var(--pine));
    color:#fff;
    transform:rotateY(180deg);
    justify-content:space-between;
  }
  .flip-back p{font-size:15px; line-height:1.6; color:rgba(255,255,255,0.85);}
  .flip-back .price{
    font-family:'Fraunces',serif;
    font-size:30px;
    color:var(--mint);
  }
  .flip-back .price span{font-size:14px; font-family:'Manrope',sans-serif; color:rgba(255,255,255,0.7); font-weight:600;}
  .flip-back .book-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:var(--coral);
    padding:10px 16px;
    border-radius:999px;
    width:fit-content;
    transition:background 0.25s ease, transform 0.25s ease;
  }
  .flip-back .book-link:hover{background:var(--coral-deep); transform:translateX(3px);}

  /* ---------- about ---------- */
  .about{
    padding:110px 0;
    background:var(--mint-pale);
    overflow:hidden;
  }
  .about-grid{
    display:grid;
    grid-template-columns:0.9fr 1.1fr;
    gap:70px;
    align-items:center;
  }
  .about-visual{
    position:relative;
    height:440px;
  }
  .stack-layer{
    position:absolute;
    left:50%;
    border-radius:28px;
    box-shadow:0 24px 40px -22px rgba(15,51,44,0.35);
  }
  .stack-layer.l1{
    width:320px; height:190px; top:10%;
    transform:translateX(-50%);
    background:linear-gradient(155deg,#fff,#eaf6f1);
    border:1px solid var(--line);
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stack-layer.l1 svg{width:64px; height:64px; opacity:0.5;}
  .stack-layer.l2{
    width:340px; height:190px; top:32%;
    transform:translateX(-50%);
    background:var(--mint);
    z-index:2;
    opacity:0.9;
  }
  .stack-layer.l3{
    width:360px; height:190px; top:54%;
    transform:translateX(-50%);
    background:var(--pine);
    z-index:1;
    opacity:0.85;
  }
  .about-badge{
    position:absolute;
    bottom:6%; right:2%;
    background:#fff;
    border-radius:20px;
    padding:16px 20px;
    box-shadow:var(--shadow);
    display:flex; align-items:center; gap:12px;
    z-index:4;
  }
  .about-badge strong{font-family:'Fraunces',serif; font-size:24px; color:var(--pine-deep); display:block;}
  .about-badge span{font-size:12px; color:rgba(18,32,29,0.6);}

  .about-copy h2{
    font-size:clamp(30px,3.4vw,42px);
    color:var(--pine-deep);
    line-height:1.1;
  }
  .about-copy p{
    margin-top:20px;
    font-size:17px;
    line-height:1.7;
    color:rgba(18,32,29,0.72);
    max-width:480px;
  }
  .about-list{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .about-list li{
    list-style:none;
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:600;
    color:var(--pine-deep);
    font-size:15px;
  }
  .about-list svg{flex-shrink:0; color:var(--coral);}

  /* ---------- testimonials ---------- */
  .testimonials{
    padding:110px 0;
    background:var(--pine-deep);
    color:#fff;
    overflow:hidden;
  }
  .testimonials .section-head h2{color:#fff;}
  .testimonials .section-head p{color:rgba(255,255,255,0.65);}
  .testimonials .eyebrow{background:rgba(143,212,193,0.16); color:var(--mint);}

  .t-track-wrap{
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
    padding:4px 0 20px;
  }
  .t-track-wrap::-webkit-scrollbar{display:none;}
  .t-track{
    display:flex;
    gap:24px;
    width:max-content;
  }
  .t-card{
    width:340px;
    flex-shrink:0;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:22px;
    padding:28px;
  }
  .t-stars{color:var(--coral); font-size:15px; letter-spacing:2px; margin-bottom:14px;}
  .t-card p{font-size:15px; line-height:1.65; color:rgba(255,255,255,0.85);}
  .t-person{display:flex; align-items:center; gap:12px; margin-top:20px;}
  .t-avatar{
    width:40px; height:40px; border-radius:50%;
    background:linear-gradient(135deg, var(--mint), var(--coral));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; color:var(--pine-deep); font-size:15px;
  }
  .t-person strong{display:block; font-size:14px;}
  .t-person span{font-size:12px; color:rgba(255,255,255,0.55);}

  /* ---------- booking / contact ---------- */
  .booking{
    padding:120px 0;
    background:var(--paper);
  }
  .booking-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
  }
  .contact-cards{display:flex; flex-direction:column; gap:16px; margin-top:8px;}
  .contact-card{
    display:flex;
    align-items:center;
    gap:16px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 22px;
    transition:transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .contact-card:hover{transform:translateY(-3px); box-shadow:0 16px 34px -22px rgba(15,51,44,0.4); border-color:var(--mint);}
  .contact-card .cc-icon{
    width:48px; height:48px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .cc-icon.whatsapp{background:#25D366; color:#fff;}
  .cc-icon.phone{background:var(--pine-deep); color:#fff;}
  .cc-icon.location{background:var(--coral); color:#fff;}
  .contact-card strong{display:block; font-size:16px; color:var(--pine-deep);}
  .contact-card span{font-size:14px; color:rgba(18,32,29,0.6);}
  .contact-card .go{margin-left:auto; color:var(--pine-deep); opacity:0.4; transition:transform 0.25s ease, opacity 0.25s ease;}
  .contact-card:hover .go{transform:translateX(4px); opacity:1;}

  .social-row{
    margin-top:28px;
    display:flex;
    gap:12px;
  }
  .social-row a{
    width:42px; height:42px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--pine-deep);
    transition:transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .social-row a:hover{background:var(--coral); border-color:var(--coral); color:#fff; transform:translateY(-4px) rotate(-6deg);}

  .booking-form{
    background:#fff;
    border-radius:26px;
    border:1px solid var(--line);
    padding:38px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .booking-form h3{font-size:22px; color:var(--pine-deep); margin-bottom:6px;}
  .booking-form > p{font-size:14px; color:rgba(18,32,29,0.6); margin-bottom:26px;}
  .field{
    position:relative;
    margin-bottom:24px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    padding:14px 4px 10px;
    font-family:'Manrope',sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color 0.25s ease;
    resize:none;
  }
  .field select{appearance:none;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--coral);}
  .field label{
    position:absolute;
    left:4px; top:14px;
    font-size:15px;
    color:rgba(18,32,29,0.45);
    pointer-events:none;
    transition:transform 0.22s cubic-bezier(.22,1,.36,1), color 0.22s ease, font-size 0.22s ease;
    transform-origin:left top;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label,
  .field textarea:focus + label,
  .field textarea:not(:placeholder-shown) + label,
  .field select:focus + label,
  .field.filled label{
    transform:translateY(-20px);
    font-size:12px;
    color:var(--coral);
    font-weight:700;
  }
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .submit-btn{
    width:100%;
    justify-content:center;
    margin-top:6px;
  }
  .form-success{
    position:absolute;
    inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    opacity:0;
    pointer-events:none;
    transform:scale(0.96);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  .form-success.show{opacity:1; pointer-events:all; transform:scale(1);}
  .check-circle{
    width:76px; height:76px;

  .field input, .field textarea, .field select{
    width:100%;
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    padding:14px 4px 10px;
    font-family:'Manrope',sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color 0.25s ease;
    resize:none;
  }
  .field select{appearance:none;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--coral);}
  .field label{
    position:absolute;
    left:4px; top:14px;
    font-size:15px;
    color:rgba(18,32,29,0.45);
    pointer-events:none;
    transition:transform 0.22s cubic-bezier(.22,1,.36,1), color 0.22s ease, font-size 0.22s ease;
    transform-origin:left top;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label,
  .field textarea:focus + label,
  .field textarea:not(:placeholder-shown) + label,
  .field select:focus + label,
  .field.filled label{
    transform:translateY(-20px);
    font-size:12px;
    color:var(--coral);
    font-weight:700;
  }
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:20px;}

    width:100%;
    justify-content:center;
    margin-top:6px;
  }
  .form-success{
    position:absolute;
    inset:0;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
    opacity:0;
    pointer-events:none;
    transform:scale(0.96);
    transition:opacity 0.4s ease, transform 0.4s ease;
  }
  .form-success.show{opacity:1; pointer-events:all; transform:scale(1);}
  .check-circle{
    width:76px; height:76px;
    border-radius:50%;
    background:var(--mint-pale);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:20px;
    animation:pop 0.5s cubic-bezier(.34,1.56,.64,1) 0.1s both;
  }
  @keyframes pop{from{transform:scale(0);} to{transform:scale(1);}}
  .form-success h4{font-size:22px; color:var(--pine-deep);}
  .form-success p{margin-top:10px; font-size:14px; color:rgba(18,32,29,0.6); max-width:280px;}
  .confetti-piece{
    position:absolute;
    top:-10px;
    width:8px; height:14px;
    opacity:0.9;
    animation:confetti-fall 1.6s ease-in forwards;
  }
  @keyframes confetti-fall{
    to{ transform: translateY(340px) rotate(540deg); opacity:0; }
  }
